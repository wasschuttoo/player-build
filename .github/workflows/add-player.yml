name: Add player card

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, 'Add player')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch card from efhub
        id: fetch
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          ID=$(printf '%s\n%s' "$TITLE" "$BODY" | grep -oE '[0-9]{6,}' | head -n1 || true)
          if [ -z "$ID" ]; then echo "No efhub player id found in the issue." > result.txt; exit 1; fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          node scripts/fetch-card.js "$ID" > result.txt 2>&1 || { cat result.txt; exit 1; }
          cat result.txt

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cards
          if git diff --cached --quiet; then echo "Card already in library."; exit 0; fi
          git commit -m "Add player ${{ steps.fetch.outputs.id }} (closes #${{ github.event.issue.number }})"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      # Pushes made with GITHUB_TOKEN don't trigger pages.yml, so deploy here too.
      - name: Bundle shared modules
        run: |
          mkdir -p public/lib
          for f in efhub_builder.js manager.js; do sed '1{/^#!/d}' "$f" > "public/lib/$f"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          {
            echo "Added to Build Album ✅"
            echo
            echo '```'
            cat result.txt
            echo '```'
            echo
            echo "Reload ${{ steps.deployment.outputs.page_url }} and search for the player."
          } > reply.md
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file reply.md
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          {
            echo "Couldn't add this card ❌"
            echo
            echo '```'
            cat result.txt 2>/dev/null || echo "See the workflow run for details."
            echo '```'
            echo
            echo "Check the efhub link is a player page (https://efhub.com/players/<id>), then edit the title or open a new issue."
          } > reply.md
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file reply.md
